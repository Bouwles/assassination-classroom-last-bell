<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#182f33"><meta name="description" content="Last Bell: a first-person Class 3-E training encounter. Move, coordinate, and catch one extraordinary teacher."><title>Last Bell — Class 3-E</title><style>html,body{margin:0;background:#182f33;color:#f5f4df;font-family:system-ui,sans-serif}.boot{position:fixed;inset:0;display:grid;place-content:center;text-align:center;gap:14px}.boot b{font-size:36px;letter-spacing:-1px}.boot p{font-size:13px;color:#d5ddc7;margin:0}.boot i{display:block;width:28px;height:28px;border:2px solid #f5f4df44;border-top-color:#f6d447;border-radius:50%;margin:0 auto;animation:load 1s linear infinite}@keyframes load{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.boot i{animation:none}}</style></head><body><canvas id="game" aria-label="First-person Class 3-E training game"></canvas><div id="app"><div class="boot" role="status"><i></i><b>Last Bell.</b><p>Preparing the classroom…</p></div></div><noscript>This game requires JavaScript and WebGL. Enable JavaScript, then reload.</noscript><script type="module">import('/src/main.js').catch(error=>{console.error(error);const app=document.getElementById('app');app.replaceChildren();const box=document.createElement('div');box.className='boot';const title=document.createElement('b');title.textContent='The classroom could not load.';const text=document.createElement('p');text.textContent='Check your connection and reload to try again.';const retry=document.createElement('button');retry.textContent='Reload game';retry.onclick=()=>location.reload();box.append(title,text,retry);app.append(box);});</script></body></html>
