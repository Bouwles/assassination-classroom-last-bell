<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#24463b">
<meta name="description" content="Mach 20: an Assassination Classroom fan game. Track Koro-sensei through his afterimages and land the strike before the bell.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2214%22 fill=%22%23ffd21f%22 stroke=%22%23000%22 stroke-width=%222%22/%3E%3Cpath d=%22M8 17q8 9 16 0%22 fill=%22%23fff%22 stroke=%22%23000%22 stroke-width=%221.5%22/%3E%3Ccircle cx=%2212%22 cy=%2212%22 r=%221.4%22/%3E%3Ccircle cx=%2220%22 cy=%2212%22 r=%221.4%22/%3E%3C/svg%3E">
<title>Mach 20 · Class 3-E</title>
<style>
html,body{margin:0;background:#24463b;color:#f3f1e7;font-family:system-ui,sans-serif}
.boot{position:fixed;inset:0;display:grid;place-content:center;text-align:center;gap:10px}
.boot b{font-size:40px;color:#ffd21f;letter-spacing:-1px}
.boot p{margin:0;font-size:14px}
.boot button{justify-self:center;margin-top:8px;padding:8px 18px;border:3px solid #000;background:#ffd21f;font-weight:700}
</style>
</head>
<body>
<canvas id="game" aria-label="Class 3-E classroom where Koro-sensei dodges at Mach 20"></canvas>
<div id="app"><div class="boot" role="status"><b>Mach 20</b><p>Wiping the blackboard…</p></div></div>
<noscript>This game needs JavaScript. Turn it on, then reload.</noscript>
<script type="module">
import('/src/main.js').catch(error => {
  console.error(error);
  const app = document.getElementById('app');
  app.innerHTML = '<div class="boot"><b>Class is cancelled</b><p>The game could not load. Check your connection, then reload.</p><button onclick="location.reload()">Reload</button></div>';
});
</script>
</body>
</html>
